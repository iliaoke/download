name: 下载

on:
  workflow_dispatch:
    inputs:
      download:
        description: '下载链接（aria2c 支持的 HTTP/HTTPS/FTP/磁力/种子等链接）'
        required: true
        type: string
      filename:
        description: '自定义保存文件名（可选，仅对单文件直链生效，留空则自动识别）'
        required: false
        default: ''
        type: string
      title:
        description: '自定义 Release 标题（可选，留空则默认使用 UTC 时间戳）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DL_URL: ${{ inputs.download }}
      CUSTOM_FILENAME: ${{ inputs.filename }}
      CUSTOM_TITLE: ${{ inputs.title }}

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +"%y.%m.%d_%H.%M.%S")"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

          if [[ -n "${CUSTOM_TITLE:-}" ]]; then
            RELEASE_TITLE="$CUSTOM_TITLE"
          else
            RELEASE_TITLE="$DATE"
          fi
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

          sudo apt-get update
          sudo apt-get install -y aria2 zip unzip tree

          mkdir -p dl out

      - name: Download
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DL_URL:-}" ]]; then
            echo "::error::没有提供下载链接"
            exit 1
          fi

          aria2_args=(
            --split=8
            --max-connection-per-server=8
            --continue=true
            --allow-overwrite=true
            --auto-file-renaming=false
            --max-tries=5
            --retry-wait=3
            --connect-timeout=30
            --timeout=60
            --seed-time=0
            --bt-stop-timeout=300
            --dir=dl
          )

          if [[ -n "${CUSTOM_FILENAME:-}" ]]; then
            aria2_args+=(--out="$CUSTOM_FILENAME")
          fi

          aria2c "${aria2_args[@]}" "$DL_URL"

          echo "下载目录内容："
          tree dl

          if ! find dl -type f -print -quit | grep -q .; then
            echo "::error::下载完成后 dl 目录中没有找到文件"
            exit 1
          fi

      - name: Pack (split files at 2 GiB)
        shell: bash
        run: |
          set -euo pipefail

          LIMIT=2147483648
          VOLUME_SIZE=1900m
          mkdir -p out

          count=0

          # 处理文件名冲突：清理特殊字符后若重名，则自动追加序号。
          unique_path() {
            local dir="$1"
            local filename="$2"
            local stem ext candidate n

            if [[ "$filename" == *.* && "$filename" != .* ]]; then
              stem="${filename%.*}"
              ext=".${filename##*.}"
            else
              stem="$filename"
              ext=""
            fi

            candidate="$dir/$filename"
            n=2

            while [[ -e "$candidate" ]]; do
              candidate="$dir/${stem}_${n}${ext}"
              n=$((n + 1))
            done

            printf '%s\n' "$candidate"
          }

          while IFS= read -r -d '' file; do
            count=$((count + 1))

            original_name="$(basename "$file")"
            safe_name="$(printf '%s' "$original_name" | sed 's/[^a-zA-Z0-9._-]/_/g')"

            if [[ -z "$safe_name" || "$safe_name" == "." || "$safe_name" == ".." ]]; then
              safe_name="download_$count"
            fi

            size="$(stat -c%s "$file")"

            if (( size < LIMIT )); then
              target="$(unique_path out "$safe_name")"
              echo "直接上传：$(basename "$target")（$size bytes）"
              mv -- "$file" "$target"
            else
              # 若原文件本身就是 .zip，则直接以该名称作为分卷 ZIP；
              # 否则在原文件名后追加 .zip。
              if [[ "$safe_name" == *.zip ]]; then
                archive_name="$safe_name"
              else
                archive_name="${safe_name}.zip"
              fi

              target="$(unique_path out "$archive_name")"
              echo "分卷打包：$(basename "$target")（$size bytes）"

              # -0：仅存储，不压缩；-s：每卷 1900 MiB。
              # 生成 .z01/.z02/... 以及最后一个 .zip 文件。
              zip -0 -s "$VOLUME_SIZE" -j "$target" "$file"

              rm -f -- "$file"
            fi
          done < <(find dl -type f -print0)

          if (( count == 0 )); then
            echo "::error::dl 目录中没有可打包的文件"
            exit 1
          fi

          echo "打包结果："
          find out -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

          if ! find out -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::out 目录中没有生成任何文件"
            exit 1
          fi

      - name: Upload to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 使用 Bash 数组传递附件，避免空格、括号等字符造成参数拆分。
          # Pack 步骤已将方括号等特殊字符替换为下划线。
          shopt -s nullglob
          assets=(out/*)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::out 目录没有可上传的文件"
            exit 1
          fi

          {
            echo "## 下载信息"
            echo
            echo "- **来源**：\`$DL_URL\`"
            echo "- **时间（UTC）**：\`$DATE\`"
            echo
            echo "## 文件清单与 SHA256 校验"
            echo
            echo "| 文件名 | 大小 | SHA256 |"
            echo "| --- | --- | --- |"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              human_size="$(numfmt --to=iec-i --suffix=B "$(stat -c%s "$asset")")"
              sha="$(sha256sum "$asset" | awk '{print $1}')"
              echo "| \`$name\` | $human_size | \`$sha\` |"
            done
            echo
            echo "## 分卷解压说明"
            echo
            echo "如果附件包含 \`.z01\`、\`.z02\` 等分卷，请将**所有分卷**下载到同一目录："
            echo
            echo "- **Windows**：使用 **7-Zip** 或 **WinRAR** 打开最后一个 \`.zip\` 文件进行解压。"
            echo "- **Linux / macOS**："
            echo '```bash'
            echo 'zip -s 0 文件名.zip --out merged.zip'
            echo 'unzip merged.zip'
            echo '```'
          } > notes.md

          echo "即将上传以下附件："
          printf ' - %s\n' "${assets[@]}"

          release_url="$(gh release create "$DATE" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$RELEASE_TITLE" \
            --notes-file notes.md)"

          {
            echo "### 下载与发布完成"
            echo
            echo "- **Release 链接**：$release_url"
            echo "- **文件数量**：${#assets[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
